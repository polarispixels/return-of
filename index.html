<!doctype html>
<html lang="en" data-style="editorial">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return Of</title>
  <meta name="description" content="Return Of: a personal study book on investing and trading.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div class="wrap">
    <header class="masthead label">
      <span>A study book</span>
      <span>Investing and trading</span>
    </header>

    <main>
      <section class="title-page">
        <h1 class="title"><span>Return</span> <span><em>Of</em></span></h1>
        <hr class="title-rule">
        <figure class="epigraph">
          <blockquote>
            <p>The most important return on your capital is the return of your capital.</p>
          </blockquote>
          <figcaption>
            <span class="label">Often attributed to Will Rogers</span>
            <p class="epigraph-note">Probably not his. Quote Investigator traced the wordplay to a Prudence Bonds advertisement in The New York Times of April 27, 1920, which promised &ldquo;not only the return on your money, but the return of your money.&rdquo; Rogers died in 1935 and was first credited with a version in 1938. The wording has kept changing since. <a href="https://quoteinvestigator.com/2025/06/27/return-money/">Read the research</a>.</p>
          </figcaption>
        </figure>
        <p class="standfirst">A personal study book on investing and trading, written one page at a time.</p>
      </section>

      <section class="pair" aria-label="The thesis in two figures">
        <figure class="figure" data-style="swiss">
          <div class="figure-head">
            <span class="figure-number">Fig. 1: Return on</span>
            <h2 class="figure-title">What one dollar becomes in 30 years</h2>
          </div>
          <div class="chart" data-chart="compound"></div>
          <p class="figure-note">One dollar, compounded once a year at a constant rate, with nothing added or taken out. Arithmetic only: not a forecast and not market data.</p>
        </figure>

        <figure class="figure" data-style="swiss">
          <div class="figure-head">
            <span class="figure-number">Fig. 2: Return of</span>
            <h2 class="figure-title">What it takes to get back to even</h2>
          </div>
          <div class="chart" data-chart="breakeven"></div>
          <p class="figure-note">Gain needed = loss &divide; (1 &minus; loss), with both bars on the same scale. Arithmetic only: not a forecast and not market data.</p>
        </figure>
      </section>
    </main>

    <footer class="colophon label">
      <nav>
        <a href="docs/">Docs</a>
        <a href="https://github.com/polarispixels/return-of">GitHub</a>
      </nav>
      <span data-version></span>
    </footer>
  </div>

  <script src="js/version.js"></script>
  <script src="js/chart.js"></script>
</body>
</html>
